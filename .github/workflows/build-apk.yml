name: Build Phonics APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)
          test -n "$ZIP"
          unzip -q "$ZIP"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: Phonics_Adventure_App_V4/android-app
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: Phonics_Adventure_App_V4/android-app/app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error
