
name: Build Phonics APK V4.1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Extract import fix project
        run: unzip -oq PhonicsAdventureV4_importfix_source.zip

      - name: Rebuild app with import fix
        run: python3 Phonics_Adventure_App_V4/source/build.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: Phonics_Adventure_App_V4/android-app
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: PhonicsAdventure-v41-debug
          path: Phonics_Adventure_App_V4/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
